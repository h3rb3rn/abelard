<!DOCTYPE html>
<html lang="de" class="dark h-full bg-slate-950 text-slate-100 font-sans antialiased">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Abelard — Multi-Agent Debate Platform</title>
  <!-- Local Tailwind CSS -->
  <link rel="stylesheet" href="/static/css/tailwind.css"/>
  <style>
    /* Custom scrollbars & glassmorphism accents */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #020617; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #334155; }
    .glass-card {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(51, 65, 85, 0.5);
    }
    .glass-card-hover:hover {
      border-color: rgba(99, 102, 241, 0.5);
      box-shadow: 0 0 20px -5px rgba(99, 102, 241, 0.2);
    }
    .pulse-dot {
      animation: pulse-ring 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    @keyframes pulse-ring {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: .4; transform: scale(1.15); }
    }

    /* Light Mode Theme Overrides */
    html.light, html.light body {
      background-color: #f8fafc !important;
      color: #0f172a !important;
    }
    html.light #page-login {
      background: radial-gradient(circle at center, #ffffff 0%, #f1f5f9 60%, #e2e8f0 100%) !important;
    }
    html.light .glass-card {
      background: rgba(255, 255, 255, 0.9) !important;
      backdrop-filter: blur(16px) !important;
      border-color: rgba(226, 232, 240, 0.9) !important;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.03) !important;
      color: #0f172a !important;
    }
    html.light .glass-card-hover:hover {
      border-color: rgba(99, 102, 241, 0.5) !important;
      box-shadow: 0 12px 30px -5px rgba(99, 102, 241, 0.15) !important;
    }
    html.light aside {
      background-color: #ffffff !important;
      border-color: #e2e8f0 !important;
    }
    html.light main {
      background-color: #f8fafc !important;
    }
    html.light .text-white, html.light .text-slate-100, html.light .text-slate-200 {
      color: #0f172a !important;
    }
    html.light .text-slate-300, html.light .text-slate-400 {
      color: #334155 !important;
    }
    html.light .text-slate-500 {
      color: #64748b !important;
    }
    html.light .bg-slate-900, html.light .bg-slate-950 {
      background-color: #f1f5f9 !important;
    }
    html.light .bg-slate-900\/90, html.light .bg-slate-950\/60, html.light .bg-slate-950\/80, html.light .bg-slate-950\/90 {
      background-color: #ffffff !important;
    }
    html.light .border-slate-800, html.light .border-slate-800\/80, html.light .border-slate-800\/60, html.light .border-slate-700\/70 {
      border-color: #e2e8f0 !important;
    }
    html.light input, html.light select, html.light textarea {
      background-color: #ffffff !important;
      color: #0f172a !important;
      border-color: #cbd5e1 !important;
    }
    html.light input::placeholder, html.light textarea::placeholder {
      color: #94a3b8 !important;
    }
    html.light ::-webkit-scrollbar-track { background: #f1f5f9; }
    html.light ::-webkit-scrollbar-thumb { background: #cbd5e1; }
    html.light ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
</head>
<body class="h-full bg-slate-950 text-slate-100 flex flex-col font-sans selection:bg-indigo-500 selection:text-white">

<!-- Auth Container -->
<div id="page-login" class="min-h-screen flex items-center justify-center p-4 bg-radial from-slate-900 via-slate-950 to-slate-950">
  <div class="w-full max-w-md glass-card rounded-2xl p-8 space-y-6 shadow-2xl border border-slate-800">
    <div class="text-center space-y-2">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-br from-indigo-500 to-violet-600 text-white font-bold text-2xl shadow-lg shadow-indigo-500/20 mb-2">
        SDE
      </div>
      <h1 class="text-2xl font-extrabold tracking-tight text-white">Abelard</h1>

    <!-- Auth Tabs -->

    <!-- Login Form -->
    <form id="form-login" onsubmit="event.preventDefault(); handleSubmit();" class="space-y-4">

        <label class="block text-xs font-medium text-slate-300 mb-1">E-Mail Adresse</label>

      </div>
      <div>
        <label class="block text-xs font-medium text-slate-300 mb-1">Passwort</label>
        <input type="password" required id="l-pass" placeholder="••••••••" class="w-full px-3.5 py-2.5 bg-slate-900/90 border border-slate-700/70 rounded-lg text-sm text-white focus:outline-none focus:border-indigo-500 transition-colors placeholder:text-slate-500"/>
      </div>
    </form>

    <!-- Register Form -->
    <form id="form-register" onsubmit="event.preventDefault(); handleSubmit();" class="space-y-4 hidden">
      <div>
        <label class="block text-xs font-medium text-slate-300 mb-1">Name</label>
        <input type="text" id="r-name" placeholder="Ihr Name" class="w-full px-3.5 py-2.5 bg-slate-900/90 border border-slate-700/70 rounded-lg text-sm text-white focus:outline-none focus:border-indigo-500 transition-colors placeholder:text-slate-500"/>
      </div>
      <div>
        <label class="block text-xs font-medium text-slate-300 mb-1">E-Mail Adresse</label>
        <input type="email" required id="r-email" placeholder="name@beispiel.de" class="w-full px-3.5 py-2.5 bg-slate-900/90 border border-slate-700/70 rounded-lg text-sm text-white focus:outline-none focus:border-indigo-500 transition-colors placeholder:text-slate-500"/>
      </div>
      <div>
        <label class="block text-xs font-medium text-slate-300 mb-1">Passwort (min. 8 Zeichen)</label>
        <input type="password" required minlength="8" id="r-pass" placeholder="••••••••" class="w-full px-3.5 py-2.5 bg-slate-900/90 border border-slate-700/70 rounded-lg text-sm text-white focus:outline-none focus:border-indigo-500 transition-colors placeholder:text-slate-500"/>
      </div>
    </form>

    <button id="submit-btn" onclick="handleSubmit()" class="w-full py-3 bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-semibold rounded-xl text-sm shadow-lg shadow-indigo-600/30 transition-all cursor-pointer">
      Anmelden
    </button>
    <div id="auth-error" class="text-xs text-rose-400 text-center min-h-[1.5rem] font-medium"></div>
  </div>
</div>

      <div class="text-[10px] uppercase tracking-wider font-bold text-slate-500 px-3 py-1 pt-4">Infrastruktur</div>

      <a onclick="navigate('connections')" data-page="connections" class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-semibold text-slate-300 hover:text-white hover:bg-slate-800/60 transition cursor-pointer">

        <span>LLM Verbindungen</span>
      </a>

      <a onclick="navigate('knowledge')" data-page="knowledge" class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-semibold text-slate-300 hover:text-white hover:bg-slate-800/60 transition cursor-pointer">
        <svg class="w-4 h-4 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
        <span>Wissen / GraphRAG</span>
      </a>
    </nav>

    <!-- Language & Theme Selector & User Footer -->
    <div class="p-3 border-t border-slate-800 space-y-2">
      <div class="flex items-center justify-between px-2 text-xs text-slate-400">
        <span class="font-medium">Design</span>
        <button id="theme-toggle-btn" onclick="toggleTheme()" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 rounded-md text-[11px] font-semibold transition flex items-center gap-1.5 cursor-pointer">
          🌙 Dunkel
        </button>
      </div>
      <div class="flex items-center justify-between px-2 text-xs text-slate-400">
        <span class="font-medium">Sprache</span>
        <select id="lang-select" onchange="setLang(this.value)" class="bg-slate-800 text-slate-200 border border-slate-700 rounded-md px-2 py-1 text-[11px] focus:outline-none cursor-pointer">

          <option value="en">English 🇬🇧</option>
        </select>

      <button onclick="handleLogout()" class="w-full py-2 bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/30 rounded-xl text-xs font-semibold transition cursor-pointer">

  </aside>

  <!-- Main Content Area -->

<!-- Global Modal Overlay -->
<div id="modal-overlay" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
  <div class="glass-card w-full max-w-xl rounded-2xl p-6 shadow-2xl border border-slate-800 max-h-[90vh] overflow-y-auto" id="modal-box">
  </div>
</div>

<script>
var TOKEN = localStorage.getItem("jwt_token") || "";
var API = "/api/v2";
var currentUser = null;
var currentPage = "dashboard";
var currentTab = "login";
var currentLang = localStorage.getItem("locale") || "de";
var currentTheme = localStorage.getItem("sde_theme") || "dark";
var currentViewMode = localStorage.getItem("sde_view_mode") || "grid";
var activeWebsocket = null;
var activeDebateId = null;

function initTheme() {
  if (currentTheme === "light") {
    document.documentElement.classList.remove("dark");
    document.documentElement.classList.add("light");
  } else {
    document.documentElement.classList.remove("light");
    document.documentElement.classList.add("dark");
  }
  updateThemeToggleButtons();
}

function toggleTheme() {
  currentTheme = currentTheme === "dark" ? "light" : "dark";
  localStorage.setItem("sde_theme", currentTheme);
  initTheme();
}

function updateThemeToggleButtons() {
  var btn = document.getElementById("theme-toggle-btn");
  var isDark = currentTheme === "dark";
  var label = isDark ? (currentLang === "de" ? "🌙 Dunkel" : "🌙 Dark") : (currentLang === "de" ? "☀️ Hell" : "☀️ Light");
  if (btn) btn.innerHTML = label;
}

function setViewMode(mode) {
  if (mode !== "grid" && mode !== "list") return;
  currentViewMode = mode;
  localStorage.setItem("sde_view_mode", mode);
  navigate(currentPage);
}

function renderViewModeToggle() {
  var isGrid = currentViewMode === "grid";
  var gridLabel = currentLang === "de" ? "Kacheln" : "Grid";
  var listLabel = currentLang === "de" ? "Liste" : "List";
  return `
    <div class="flex items-center gap-1 bg-slate-900/80 p-1 rounded-xl border border-slate-800 shadow-inner">
      <button onclick="setViewMode('grid')" title="${gridLabel}" class="px-2.5 py-1 text-xs font-semibold rounded-lg transition-all flex items-center gap-1.5 cursor-pointer ${isGrid ? 'bg-indigo-600 text-white shadow-sm' : 'text-slate-400 hover:text-white'}">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>
        <span class="hidden sm:inline">${gridLabel}</span>
      </button>
      <button onclick="setViewMode('list')" title="${listLabel}" class="px-2.5 py-1 text-xs font-semibold rounded-lg transition-all flex items-center gap-1.5 cursor-pointer ${!isGrid ? 'bg-indigo-600 text-white shadow-sm' : 'text-slate-400 hover:text-white'}">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
        <span class="hidden sm:inline">${listLabel}</span>
      </button>
    </div>
  `;
}

initTheme();

document.getElementById("lang-select").value = currentLang;

function setToken(t) {
  if (t) localStorage.setItem("jwt_token", t);
  else localStorage.removeItem("jwt_token");
  TOKEN = t;
}

function showApp() {
  document.getElementById("page-login").classList.add("hidden");
  document.getElementById("page-app").classList.remove("hidden");
  document.getElementById("page-app").classList.add("flex");
  if (currentUser) document.getElementById("sidebar-email").textContent = currentUser.name || currentUser.email || "";
}

function hideApp() {
  document.getElementById("page-login").classList.remove("hidden");
  document.getElementById("page-login").classList.add("flex");
  document.getElementById("page-app").classList.add("hidden");
  document.getElementById("page-app").classList.remove("flex");
}

function showTab(tab) {
  currentTab = tab;
  var btn = document.getElementById("submit-btn");
  if (tab === "login") {
    document.getElementById("form-login").classList.remove("hidden");
    document.getElementById("form-register").classList.add("hidden");
    document.getElementById("tab-login").className = "flex-1 py-2 text-xs font-semibold rounded-lg transition-all text-white bg-indigo-600 shadow-sm";
    document.getElementById("tab-register").className = "flex-1 py-2 text-xs font-semibold rounded-lg transition-all text-slate-400 hover:text-white";
    btn.textContent = "Anmelden";
  } else {
    document.getElementById("form-login").classList.add("hidden");
    document.getElementById("form-register").classList.remove("hidden");
    document.getElementById("tab-register").className = "flex-1 py-2 text-xs font-semibold rounded-lg transition-all text-white bg-indigo-600 shadow-sm";
    document.getElementById("tab-login").className = "flex-1 py-2 text-xs font-semibold rounded-lg transition-all text-slate-400 hover:text-white";
    btn.textContent = "Registrieren";
  }
}

async function handleSubmit() {
  var btn = document.getElementById("submit-btn");
  var err = document.getElementById("auth-error");
  btn.disabled = true;
  err.textContent = "";

  if (currentTab === "register") {
    var name = document.getElementById("r-name").value.trim();
    var email = document.getElementById("r-email").value.trim();
    var pw = document.getElementById("r-pass").value;
    try {
      var r = await fetch(API + "/auth/register", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name: name, email: email, password: pw })
      });
      if (!r.ok) {
        var d = await r.json().catch(() => ({}));
        err.textContent = d.detail || "Registrierung fehlgeschlagen";
        btn.disabled = false; return;
      }
      alert("Registrierung erfolgreich! Bitte anmelden.");
      showTab("login");
    } catch (e) { err.textContent = e.message; }
    btn.disabled = false; return;
  }

  var email = document.getElementById("l-email").value.trim();
  var pw = document.getElementById("l-pass").value;
  try {
    var r = await fetch(API + "/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: new URLSearchParams({ username: email, password: pw })
    });
    if (!r.ok) { err.textContent = "Ungültige E-Mail oder Passwort"; btn.disabled = false; return; }
    var data = await r.json();
    setToken(data.access_token);
    currentUser = { email: email };
    showApp();
    navigate("dashboard");
  } catch (e) { err.textContent = e.message || "Netzwerkfehler"; }
  btn.disabled = false;
}

function handleLogout() {
  setToken("");
  TOKEN = "";
  currentUser = null;
  if (activeWebsocket) { activeWebsocket.close(); activeWebsocket = null; }
  hideApp();
}

async function api(url, method = "GET", payload = null) {
  var opts = { method: method, headers: { "Authorization": "Bearer " + TOKEN } };
  if (payload) {
    opts.headers["Content-Type"] = "application/json";
    opts.body = JSON.stringify(payload);
  }
  try {
    var r = await fetch(API + url, opts);
    if (!r.ok) {
      var d = await r.json().catch(function() { return { detail: r.statusText }; });
      var detailMsg = typeof d.detail === 'string' ? d.detail : JSON.stringify(d.detail);
      return { _error: true, detail: detailMsg || ("HTTP " + r.status) };
    }
    if (r.status === 204) return true;
    return await r.json();
  } catch(e) {
    return { _error: true, detail: e.message || "Netzwerkfehler" };
  }
}

function htmlEsc(str) {
  if (!str) return "";
  var d = document.createElement("div");
  d.textContent = str;
  return d.innerHTML;
}

// ---- Globale Agenten: Badges & Aktionen ----

function isAdmin() {
  return !!(currentUser && currentUser.is_admin);
}

function agentGlobalBadge(a) {
  if (a.is_global && a.is_owner) {
    return '<span class="px-2 py-0.5 rounded bg-violet-500/10 text-violet-300 border border-violet-500/30 text-[10px] font-semibold">🌍 Global freigegeben</span>';
  }
  if (a.is_global && !a.is_owner) {
    return '<span class="px-2 py-0.5 rounded bg-violet-500/10 text-violet-300 border border-violet-500/30 text-[10px] font-semibold">🌍 Global (fremd)</span>';
  }
  return '';
}

function agentActions(a, compact) {
  var cls = compact
    ? { edit: "text-amber-400 hover:text-amber-300 text-[11px] font-semibold cursor-pointer",
        del:  "text-rose-400 hover:text-rose-300 text-[11px] font-semibold cursor-pointer",
        glob: "text-violet-400 hover:text-violet-300 text-[11px] font-semibold cursor-pointer",
        take: "text-sky-400 hover:text-sky-300 text-[11px] font-semibold cursor-pointer" }
    : { edit: "px-3 py-1.5 bg-amber-500/10 hover:bg-amber-500/20 text-amber-400 border border-amber-500/30 rounded-lg text-xs font-semibold cursor-pointer",
        del:  "px-3 py-1.5 bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/30 rounded-lg text-xs font-semibold cursor-pointer",
        glob: "px-3 py-1.5 bg-violet-500/10 hover:bg-violet-500/20 text-violet-400 border border-violet-500/30 rounded-lg text-xs font-semibold cursor-pointer",
        take: "px-3 py-1.5 bg-sky-500/10 hover:bg-sky-500/20 text-sky-400 border border-sky-500/30 rounded-lg text-xs font-semibold cursor-pointer" };

  if (!a.is_owner) {
    return '<button onclick="cloneAgent(\'' + a.id + '\')" class="' + cls.take + '" title="Als eigene, bearbeitbare Kopie übernehmen">📥 Übernehmen</button>';
  }
  var html = '';
  if (isAdmin()) {
    var label = a.is_global ? '🌍 Freigabe zurückziehen' : '🌍 Global freigeben';
    html += '<button onclick="toggleAgentGlobal(\'' + a.id + '\', ' + (a.is_global ? 'false' : 'true') + ')" class="' + cls.glob + '">' + label + '</button>';
  }
  html += '<button onclick="showEditAgentModal(\'' + a.id + '\')" class="' + cls.edit + '">Bearbeiten</button>';
  html += '<button onclick="deleteAgent(\'' + a.id + '\')" class="' + cls.del + '">Löschen</button>';
  return html;
}

async function toggleAgentGlobal(id, makeGlobal) {
  var res = await api("/agents/" + id + "/global", "PATCH", { is_global: makeGlobal });
  if (!res || res._error) {
    alert("Freigabe fehlgeschlagen: " + (res && res.detail ? res.detail : "Unbekannter Fehler"));
    return;
  }
  navigate("agents");
}

async function cloneAgent(id) {
  var res = await api("/agents/" + id + "/clone", "POST", {});
  if (!res || res._error) {
    alert("Übernehmen fehlgeschlagen: " + (res && res.detail ? res.detail : "Unbekannter Fehler"));
    return;
  }
  alert("'" + res.name + "' wurde als eigene Kopie übernommen und ist jetzt bearbeitbar.");
  navigate("agents");
}

function setLang(lang) {
  currentLang = lang;
  localStorage.setItem("locale", lang);
  navigate(currentPage);
}

async function navigate(page) {
  currentPage = page;
  if (!TOKEN) return;

  document.querySelectorAll(".nav-item").forEach(function(el) {
    if (el.dataset.page === page) {
      el.className = "nav-item flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-bold text-white bg-indigo-600 shadow-md shadow-indigo-600/20 transition cursor-pointer";
    } else {
      el.className = "nav-item flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-semibold text-slate-300 hover:text-white hover:bg-slate-800/60 transition cursor-pointer";
    }
  });

  var container = document.getElementById("main-content");
  if (page === "dashboard") await renderDashboard(container);
  else if (page === "agents") await renderAgentsPage(container);
  else if (page === "projects") await renderProjectsPage(container);
  else if (page === "debates") await renderDebatesPage(container);
  else if (page === "connections") await renderConnectionsPage(container);
  else if (page === "knowledge") await renderKnowledgePage(container);
}

var cachedModelsList = [];

async function loadModelsForAgentModal(provider, selectedModel) {
  var selectEl = document.getElementById("ag-model-select") || document.getElementById("ag-edit-model-select");
  var countBadge = document.getElementById("ag-model-count") || document.getElementById("ag-edit-model-count");

  if (selectEl) selectEl.innerHTML = `<option value="">Modelle werden geladen...</option>`;
  if (countBadge) countBadge.textContent = "Abfrage der API...";

  var models = await api("/llm-endpoints/models?provider=" + provider) || [];
  if (models && models._error) models = [];

  if (models.length === 0) {
    models = provider === "openai" ? ["gpt-4o-mini", "gpt-4o", "gpt-4-turbo"] : ["llama3:8b", "gemma2:9b", "mistral:latest"];
  }

  cachedModelsList = models;
  if (countBadge) countBadge.textContent = models.length + " Modelle erreichbar";

  renderModelOptions(models, selectedModel);
}

function filterAgentModels(query) {
  var q = (query || "").toLowerCase().trim();
  var filtered = q ? cachedModelsList.filter(m => m.toLowerCase().includes(q)) : cachedModelsList;
  var countBadge = document.getElementById("ag-model-count") || document.getElementById("ag-edit-model-count");
  if (countBadge) countBadge.textContent = filtered.length + " von " + cachedModelsList.length + " Modellen";
  renderModelOptions(filtered);
}

function renderModelOptions(modelsList, selectedModel) {
  var selectEl = document.getElementById("ag-model-select") || document.getElementById("ag-edit-model-select");
  var targetInput = document.getElementById("ag-model") || document.getElementById("ag-edit-model");
  if (!selectEl) return;

  var currentInputVal = targetInput ? targetInput.value : "";
  var activeVal = selectedModel || currentInputVal || (modelsList[0] || "");

  if (modelsList.length === 0) {
    selectEl.innerHTML = `<option value="">Keine passenden Modelle gefunden</option>`;
    return;
  }

  var sliceList = modelsList.slice(0, 500);
  selectEl.innerHTML = sliceList.map(m => `<option value="${htmlEsc(m)}" ${m === activeVal ? 'selected' : ''}>${htmlEsc(m)}</option>`).join('');

  if (activeVal && targetInput && !targetInput.value) {
    targetInput.value = activeVal;
  }
}

function applyAgentPreset(name, bio, prompt) {

}

async function submitAgent() {
  var name = document.getElementById("ag-name").value.trim();
  var bio = document.getElementById("ag-bio").value.trim();
  var prompt = document.getElementById("ag-prompt").value.trim();
  var provider = document.getElementById("ag-provider").value;
  var model = document.getElementById("ag-model").value.trim() || (provider === "openai" ? "gpt-4o-mini" : "llama3:8b");
  var searchEnabled = document.getElementById("ag-search-enabled") ? document.getElementById("ag-search-enabled").checked : false;
  var searchProvider = document.getElementById("ag-search-provider") ? document.getElementById("ag-search-provider").value : "duckduckgo";
  var searxngUrl = document.getElementById("ag-searxng-url") ? document.getElementById("ag-searxng-url").value.trim() : "";

  var errEl = document.getElementById("ag-error");
  if (errEl) errEl.textContent = "";

  if (!name) { if (errEl) errEl.textContent = "Bitte einen Namen angeben"; return; }

  var res = await api("/agents", "POST", {
    name: name,
    persona_bio: bio,
    system_prompt: prompt,
    llm_provider: provider,
    llm_model: model,
    web_search_enabled: searchEnabled,
    web_search_provider: searchProvider,
    searxng_url: searxngUrl
  });

  if (res && res._error) {
    if (errEl) errEl.textContent = res.detail || "Fehler beim Erstellen des Agenten";
    return;
  }

  closeModal();
  navigate("agents");
}

  await api("/agents/" + id, "DELETE");
  navigate("agents");
}

async function submitEditProject(id) {
  var name = document.getElementById("pj-edit-name").value.trim();
  var motion = document.getElementById("pj-edit-motion").value.trim();
  var modGoal = document.getElementById("pj-edit-mod-goal").value.trim();
  var modInterval = parseInt(document.getElementById("pj-edit-mod-interval").value) || 3;
  var maxRounds = parseInt(document.getElementById("pj-edit-max-rounds").value) || 15;
  var maxDurVal = document.getElementById("pj-edit-max-duration").value;
  var maxDuration = maxDurVal !== "" ? parseInt(maxDurVal) : null;
  var errEl = document.getElementById("pj-edit-error");
  if (errEl) errEl.textContent = "";

  var selectedAgentIds = Array.from(document.querySelectorAll('input[name="pj-edit-agents"]:checked')).map(cb => cb.value);

  if (!name || !motion) { if (errEl) errEl.textContent = "Bitte Name und Thema angeben"; return; }

  var mode = agentModeValues("edit");
  var res = await api("/projects/" + id, "PATCH", {
    name: name,
    motion: motion,
    agent_ids: mode.agent_selection_mode === "auto" ? [] : selectedAgentIds,
    moderator_goal: modGoal,
    moderator_interval: modInterval,
    max_rounds: maxRounds,
    max_duration_minutes: maxDuration,
    agent_selection_mode: mode.agent_selection_mode,
    auto_agent_count: mode.auto_agent_count
  });

  if (res && res._error) {
    if (errEl) errEl.textContent = res.detail || "Fehler beim Speichern des Projekts";
    return;
  }

  closeModal();
  navigate("projects");
}

async function submitProject() {
  var name = document.getElementById("pj-name").value.trim();

    name: name,

function agentModeBlock(prefix, mode, count) {
  var isAuto = mode === "auto";
  return `
    <div class="bg-violet-950/20 p-3.5 rounded-xl border border-violet-900/40 space-y-2.5">
      <div class="text-xs font-bold text-violet-300">🧭 Auswahl der Teilnehmer</div>
      <div class="flex flex-col gap-1.5">
        <label class="flex items-center gap-2 text-xs text-slate-300 cursor-pointer">
          <input type="radio" name="pj-${prefix}-mode" value="manual" ${isAuto ? '' : 'checked'} onchange="onAgentModeChange('${prefix}')" class="text-emerald-500 focus:ring-0"/>
          <span>Manuell — ich wähle die Agenten selbst</span>
        </label>
        <label class="flex items-center gap-2 text-xs text-slate-300 cursor-pointer">
          <input type="radio" name="pj-${prefix}-mode" value="auto" ${isAuto ? 'checked' : ''} onchange="onAgentModeChange('${prefix}')" class="text-violet-500 focus:ring-0"/>
          <span>Automatisch — KI wählt die zum Thema passendsten Agenten</span>
        </label>
      </div>
      <div id="pj-${prefix}-count-wrap" class="${isAuto ? '' : 'hidden'} flex items-center gap-2">
        <label class="text-[11px] text-slate-300">Anzahl Teilnehmer</label>
        <input type="number" id="pj-${prefix}-count" value="${count}" min="2" max="12" class="w-20 px-2 py-1 bg-slate-900 border border-slate-700 rounded-lg text-xs text-white focus:outline-none"/>
        <span class="text-[10px] text-slate-500">Analyse läuft über dein Standard-LLM aus dem Profil</span>
      </div>
    </div>`;
}

function onAgentModeChange(prefix) {
  var sel = document.querySelector('input[name="pj-' + prefix + '-mode"]:checked');
  var isAuto = sel && sel.value === "auto";
  var ids = { manual: "pj-" + prefix + "-manual-block", auto: "pj-" + prefix + "-auto-block", count: "pj-" + prefix + "-count-wrap" };
  var m = document.getElementById(ids.manual), a = document.getElementById(ids.auto), c = document.getElementById(ids.count);
  if (m) m.classList.toggle("hidden", isAuto);
  if (a) a.classList.toggle("hidden", !isAuto);
  if (c) c.classList.toggle("hidden", !isAuto);
}

function agentModeValues(prefix) {
  var sel = document.querySelector('input[name="pj-' + prefix + '-mode"]:checked');
  var cnt = document.getElementById("pj-" + prefix + "-count");
  return {
    agent_selection_mode: sel ? sel.value : "manual",
    auto_agent_count: cnt ? (parseInt(cnt.value) || 4) : 4
  };
}

async function previewAutoAgents(projectId, prefix) {
  var el = document.getElementById("pj-" + prefix + "-preview");
  if (el) el.innerHTML = '<span class="text-slate-400">Analysiere Thema mit deinem Profil-LLM… das kann eine Minute dauern.</span>';
  var cnt = document.getElementById("pj-" + prefix + "-count");
  var q = cnt && cnt.value ? "?count=" + (parseInt(cnt.value) || 4) : "";
  var res = await api("/projects/" + projectId + "/suggest-agents" + q, "POST", {});
  if (!res || res._error) {
    if (el) el.innerHTML = '<span class="text-rose-400">Auswahl fehlgeschlagen: ' + htmlEsc(res && res.detail ? res.detail : "Unbekannter Fehler") + '</span>';
    return;
  }
  if (!el) return;
  el.innerHTML =
    (res.rationale ? '<div class="mb-2 italic text-violet-200">' + htmlEsc(res.rationale) + '</div>' : '') +
    '<div class="space-y-1.5">' + res.selection.map(function(s) {
      return '<div class="p-2 bg-slate-900/60 border border-slate-800 rounded-lg">' +
             '<span class="text-white font-semibold">' + htmlEsc(s.name) + '</span>' +
             (s.is_global ? ' <span class="text-[10px] text-violet-300">🌍</span>' : '') +
             '<div class="text-[11px] text-slate-400">' + htmlEsc(s.reason) + '</div></div>';
    }).join('') + '</div>';
}

async function refreshMaterialList(projectId) {
  var listEl = document.getElementById("mat-list");
  if (!listEl) return;
  var docs = await api("/projects/" + projectId + "/documents");
  if (!docs || docs._error) {
    listEl.innerHTML = '<div class="text-xs text-rose-400">Material konnte nicht geladen werden.</div>';
    return;
  }
  if (docs.length === 0) {
    listEl.innerHTML = '<div class="text-xs text-slate-500">Noch kein Material hochgeladen.</div>';
    return;
  }
  listEl.innerHTML = docs.map(function(d) {
    var icon = d.kind === "image" ? "🖼️" : "📄";
    var sizeKb = Math.max(1, Math.round((d.size_bytes || 0) / 1024));
    var indexBadge = d.extracted_chars > 0
      ? '<span class="text-[9px] text-emerald-400">indexiert</span>'
      : '<span class="text-[9px] text-amber-400" title="Kein Text extrahiert — bei Bildern Beschreibung ergänzen">nicht indexiert</span>';
    return `
      <div class="flex items-center justify-between gap-2 p-2.5 bg-slate-900/60 border border-slate-800 rounded-xl">
        <div class="min-w-0">
          <div class="text-xs text-white font-semibold truncate">${icon} ${htmlEsc(d.filename)}</div>
          <div class="text-[10px] text-slate-400 truncate">${sizeKb} KB · ${htmlEsc(d.description || "")} ${indexBadge}</div>
        </div>
        <div class="flex items-center gap-2 shrink-0">
          <a href="${API}/projects/${projectId}/documents/${d.id}/download?token=${encodeURIComponent(TOKEN)}" target="_blank" class="text-sky-400 hover:text-sky-300 text-[11px] font-semibold">Öffnen</a>
          <button onclick="deleteProjectMaterial('${projectId}', '${d.id}')" class="text-rose-400 hover:text-rose-300 text-[11px] font-semibold cursor-pointer">Löschen</button>
        </div>
      </div>`;
  }).join("");
}

async function uploadProjectMaterial(projectId) {
  var fileInput = document.getElementById("mat-file");
  var errEl = document.getElementById("mat-error");
  var btn = document.getElementById("mat-upload-btn");
  errEl.textContent = "";
  if (!fileInput.files || fileInput.files.length === 0) {
    errEl.textContent = "Bitte eine Datei auswählen.";
    return;
  }
  var fd = new FormData();
  fd.append("file", fileInput.files[0]);
  fd.append("description", document.getElementById("mat-description").value.trim());

  btn.disabled = true;
  btn.textContent = "Lädt…";
  try {
    var r = await fetch(API + "/projects/" + projectId + "/documents", {
      method: "POST",
      headers: { "Authorization": "Bearer " + TOKEN },
      body: fd
    });
    if (!r.ok) {
      var d = await r.json().catch(function() { return { detail: r.statusText }; });
      errEl.textContent = typeof d.detail === "string" ? d.detail : JSON.stringify(d.detail);
      return;
    }
    fileInput.value = "";
    document.getElementById("mat-description").value = "";
    await refreshMaterialList(projectId);
  } catch (e) {
    errEl.textContent = e.message || "Netzwerkfehler";
  } finally {
    btn.disabled = false;
    btn.textContent = "Hochladen";
  }
}

async function deleteProjectMaterial(projectId, docId) {
  if (!confirm("Material löschen? Es steht der Debatte danach nicht mehr zur Verfügung.")) return;
  await api("/projects/" + projectId + "/documents/" + docId, "DELETE");
  await refreshMaterialList(projectId);
}

async function deleteProject(id) {
  if (!confirm("Projekt wirklich löschen?")) return;
  await api("/projects/" + id, "DELETE");
  navigate("projects");
}

function downloadActiveDebate(format) {
  if (!activeDebateId) {
    alert("Bitte wähle zuerst eine Debatte aus der Liste aus");
    return;
  }
  toggleExportMenu("arena-export-menu");
  downloadDebateFile(activeDebateId, format);
}

function downloadDebateFile(debateId, format) {
  var token = TOKEN || localStorage.getItem("jwt_token") || localStorage.getItem("sde_token") || "";
  fetch("/api/v2/debates/" + debateId + "/export?format=" + format + "&token=" + encodeURIComponent(token), {
    headers: { "Authorization": "Bearer " + token }
  })
  .then(function(res) {
    if (!res.ok) throw new Error("HTTP Fehler " + res.status);
    return res.blob();
  })
  .then(function(blob) {
    var ext = format === "markdown" ? "md" : format;
    var url = window.URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "debatte_" + debateId.substring(0, 8) + "." + ext;
    document.body.appendChild(a);
    a.click();
    a.remove();
    window.URL.revokeObjectURL(url);
  })
  .catch(function(err) {
    alert("Fehler beim Exportieren der Debatte: " + err.message);
  });
}

async function startDebateFromProject(projectId, motion) {
  var res = await api("/debates", "POST", {
    project_id: projectId,
    motion: motion
  });
  if (res && res.id) {
    navigate("debates");
    setTimeout(() => { connectAndStream(res.id, motion); }, 300);
  } else {
    alert("Fehler beim Erstellen der Debatte");
  }
}

var seenStreamMessages = new Set();

async function connectAndStream(debateId, motion) {
  activeDebateId = debateId;
  seenStreamMessages.clear();
  document.getElementById("arena-title").textContent = "Debatte: " + motion;
  document.getElementById("btn-stop-debate").classList.remove("hidden");
  
  var streamEl = document.getElementById("arena-stream");
  streamEl.innerHTML = `<div class="text-indigo-400 font-mono text-center py-6">⚡ Lädt Diskurs-Historie & Live Stream...</div>`;

  api("/debates/" + debateId + "/turns").then(function(turnsRes) {
    if (streamEl.querySelector(".font-mono")) {
      streamEl.innerHTML = "";
    }
    if (turnsRes && turnsRes.turns && turnsRes.turns.length > 0) {
      turnsRes.turns.forEach(function(t) {
        var agentName = t.agent || "AGENT";
        var content = t.content || "";
        appendStreamMessage("[" + agentName.toUpperCase() + "]: " + content);
      });
    } else {
      if (streamEl.children.length === 0) {
        streamEl.innerHTML = `<div class="text-slate-400 font-mono italic p-6 text-center">Debatte wird gestartet — Runden werden live empfangen...</div>`;
      }
    }
  });

  var loc = window.location;
  var wsProtocol = loc.protocol === "https:" ? "wss:" : "ws:";
  var wsUrl = wsProtocol + "//" + loc.host + "/api/v2/debates/" + debateId + "/stream";

  if (activeWebsocket) { activeWebsocket.close(); }

  try {
    activeWebsocket = new WebSocket(wsUrl);
    activeWebsocket.onmessage = function(evt) {
      var parsed = JSON.parse(evt.data);
      var msg = parsed.data || parsed.content || evt.data;
      appendStreamMessage(msg);
    };
  } catch(e) {
    appendStreamMessage("[STREAM ERROR]: " + e.message);
  }

  api("/debates/" + debateId + "/start", "POST");
}

function appendStreamMessage(text) {
  if (!text || seenStreamMessages.has(text)) return;
  seenStreamMessages.add(text);

  var streamEl = document.getElementById("arena-stream");
  var placeholder = streamEl.querySelector(".italic, .font-mono");
  if (placeholder && streamEl.children.length === 1) {
    streamEl.innerHTML = "";
  }

  var card = document.createElement("div");

  if (text.includes("[MODERATOR]")) {
    card.className = "p-3 rounded-xl bg-indigo-950/60 border border-indigo-800/80 text-indigo-200 font-semibold shadow-sm";
  } else if (text.includes("[CONSENSUS]") || text.includes("[SYNTHESIS]")) {
    card.className = "p-4 rounded-xl bg-emerald-950/60 border border-emerald-800/80 text-emerald-200 font-bold shadow-md";
  } else {
    card.className = "p-3.5 rounded-xl bg-slate-900 border border-slate-800 text-slate-200 leading-relaxed shadow-sm";
  }

  card.innerHTML = htmlEsc(text).replace(/\n/g, '<br/>');
  streamEl.appendChild(card);
  streamEl.scrollTop = streamEl.scrollHeight;
}

async function stopActiveDebate() {
  if (activeDebateId) {
    await api("/debates/" + activeDebateId + "/stop", "POST");
    if (activeWebsocket) activeWebsocket.close();
    document.getElementById("btn-stop-debate").classList.add("hidden");
    appendStreamMessage("[STATUS]: Debatte gestoppt.");
  }
}

      <div class="flex justify-end gap-2 pt-3 border-t border-slate-800">
        <button onclick="closeModal()" class="px-4 py-2 bg-slate-800 text-slate-300 rounded-xl text-xs font-semibold">Abbrechen</button>
        <button onclick="submitEditEndpoint('${id}')" class="px-4 py-2 bg-cyan-500 text-slate-950 font-bold rounded-xl text-xs shadow-lg shadow-cyan-500/20">Änderungen Speichern</button>
      </div>
    </div>
  `;
  overlay.classList.remove("hidden");
  overlay.classList.add("flex");
}

async function submitEditEndpoint(id) {
  var provider = document.getElementById("ep-edit-provider").value;
  var url = document.getElementById("ep-edit-url").value.trim();
  var key = document.getElementById("ep-edit-key").value.trim();
  var model = document.getElementById("ep-edit-model").value.trim();
  var errEl = document.getElementById("ep-edit-error");
  if (errEl) errEl.textContent = "";

  var payload = { provider: provider, base_url: url, llm_model: model };
  if (key) payload.api_key = key;

  var res = await api("/llm-endpoints/" + id, "PATCH", payload);

  if (res && res._error) {
    if (errEl) errEl.textContent = res.detail || "Fehler beim Speichern der Verbindung";
    return;
  }

  closeModal();
  navigate("connections");
}

async function submitEndpoint() {
  var provider = document.getElementById("ep-provider").value;
  var url = document.getElementById("ep-url").value.trim();
  var key = document.getElementById("ep-key").value.trim();
  var model = document.getElementById("ep-model").value.trim();
  var errEl = document.getElementById("ep-error");
  if (errEl) errEl.textContent = "";

  var res = await api("/llm-endpoints", "POST", {
    provider: provider,
    base_url: url,
    api_key: key,
    llm_model: model
  });

  if (res && res._error) {
    if (errEl) errEl.textContent = res.detail || "Fehler beim Erstellen der Verbindung";
    return;
  }

  closeModal();
  navigate("connections");
}

async function setDefaultEndpoint(id) {
  await api("/llm-endpoints/" + id + "/set-default", "POST");
  navigate("connections");
}

async function deleteEndpoint(id) {
  if (!confirm("Verbindung löschen?")) return;
  await api("/llm-endpoints/" + id, "DELETE");
  navigate("connections");
}

/* =========================================================================
   6. Knowledge View (GraphRAG Context Store)
   ========================================================================= */
async function renderKnowledgePage(el) {
  var items = await api("/knowledge") || [];

  var html = `
    <div class="space-y-6">
      <div class="flex items-center justify-between border-b border-slate-800/80 pb-6">
        <div>
          <h1 class="text-2xl font-black text-white tracking-tight">Wissen & GraphRAG Kontext</h1>
          <p class="text-xs text-slate-400 mt-1">Hinterlege Fakten und Hintergrundmaterial für das Gedächtnis</p>
        </div>
        <button onclick="showCreateKnowledgeModal()" class="px-4 py-2 bg-purple-500 hover:bg-purple-400 text-slate-950 font-bold rounded-xl text-xs shadow-lg shadow-purple-500/20 transition">
          + Wissen Hinzufügen
        </button>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        ${items.map(k => {
          var textVal = (typeof k.value === 'object' && k.value !== null) ? (k.value.content || JSON.stringify(k.value)) : String(k.value || '');
          return `
            <div class="glass-card glass-card-hover p-5 rounded-2xl border border-slate-800 space-y-2 flex flex-col justify-between">
              <div class="space-y-2">
                <div class="flex items-center justify-between">
                  <h4 class="font-bold text-xs text-purple-300 font-mono">${htmlEsc(k.key)}</h4>
                  <div class="flex items-center gap-2">
                    <button onclick="showEditKnowledgeModal('${k.id}', '${htmlEsc(k.key)}', '${htmlEsc(textVal)}')" class="text-purple-400 hover:text-purple-300 text-[11px] font-semibold">Bearbeiten</button>
                    <button onclick="deleteKnowledge('${k.id}')" class="text-rose-400 hover:text-rose-300 text-[11px] font-semibold">Löschen</button>
                  </div>
                </div>
                <pre class="text-[11px] text-slate-300 bg-slate-950 p-2.5 rounded-lg border border-slate-800 overflow-x-auto font-mono whitespace-pre-wrap">${htmlEsc(textVal)}</pre>
              </div>
            </div>
          `;
        }).join('')}
      </div>
    </div>
  `;
  el.innerHTML = html;
}

function showEditKnowledgeModal(id, key, val) {
  var overlay = document.getElementById("modal-overlay");
  var box = document.getElementById("modal-box");

  box.innerHTML = `
    <div class="space-y-4">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <h3 class="text-base font-bold text-white">Wissenseintrag Bearbeiten</h3>
        <button onclick="closeModal()" class="text-slate-400 hover:text-white text-lg font-bold">&times;</button>
      </div>

      <div class="space-y-3">
        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1">Schlüssel / Begriff (Key)</label>
          <input type="text" id="kn-edit-key" value="${htmlEsc(key)}" class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-xs text-white focus:outline-none focus:border-purple-500"/>
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1">Inhalt / Fakten (Text)</label>
          <textarea id="kn-edit-val" rows="4" class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-xs text-white focus:outline-none focus:border-purple-500">${htmlEsc(val)}</textarea>
        </div>
      </div>

      <div id="kn-edit-error" class="text-xs text-rose-400 font-semibold min-h-[1rem]"></div>

      <div class="flex justify-end gap-2 pt-3 border-t border-slate-800">
        <button onclick="closeModal()" class="px-4 py-2 bg-slate-800 text-slate-300 rounded-xl text-xs font-semibold">Abbrechen</button>
        <button onclick="submitEditKnowledge('${id}')" class="px-4 py-2 bg-purple-500 text-slate-950 font-bold rounded-xl text-xs shadow-lg shadow-purple-500/20">Änderungen Speichern</button>
      </div>
    </div>
  `;
  overlay.classList.remove("hidden");
  overlay.classList.add("flex");
}

async function submitEditKnowledge(id) {
  var key = document.getElementById("kn-edit-key").value.trim();
  var valText = document.getElementById("kn-edit-val").value.trim();
  var errEl = document.getElementById("kn-edit-error");
  if (errEl) errEl.textContent = "";

  if (!key || !valText) { if (errEl) errEl.textContent = "Schlüssel und Inhalt angeben"; return; }

  var res = await api("/knowledge/" + id, "PATCH", {
    key: key,
    value: { content: valText }
  });

  if (res && res._error) {
    if (errEl) errEl.textContent = res.detail || "Fehler beim Speichern";
    return;
  }

  closeModal();
  navigate("knowledge");
}

function showCreateKnowledgeModal() {
  var overlay = document.getElementById("modal-overlay");
  var box = document.getElementById("modal-box");

  box.innerHTML = `
    <div class="space-y-4">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <h3 class="text-base font-bold text-white">Wissenseintrag Hinzufügen</h3>
        <button onclick="closeModal()" class="text-slate-400 hover:text-white text-lg font-bold">&times;</button>
      </div>

      <div class="space-y-3">
        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1">Schlüssel / Begriff (Key)</label>
          <input type="text" id="kn-key" placeholder="z.B. Ethik-Richtlinie-2026" class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-xs text-white focus:outline-none"/>
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1">Inhalt / Fakten (Text)</label>
          <textarea id="kn-val" rows="4" placeholder="Fakten, Zitate oder Richtlinien eingeben..." class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-xs text-white focus:outline-none"></textarea>
        </div>
      </div>

      <div class="flex justify-end gap-2 pt-3 border-t border-slate-800">
        <button onclick="closeModal()" class="px-4 py-2 bg-slate-800 text-slate-300 rounded-xl text-xs font-semibold">Abbrechen</button>
        <button onclick="submitKnowledge()" class="px-4 py-2 bg-purple-500 text-slate-950 font-bold rounded-xl text-xs shadow-lg shadow-purple-500/20">Wissen Speichern</button>
      </div>
    </div>
  `;
  overlay.classList.remove("hidden");
  overlay.classList.add("flex");
}

async function submitKnowledge() {
  var key = document.getElementById("kn-key").value.trim();
  var valText = document.getElementById("kn-val").value.trim();

  if (!key || !valText) { alert("Schlüssel und Inhalt angeben"); return; }

  var res = await api("/knowledge", "POST", {
    key: key,
    value: { content: valText }
  });

  if (res) {
    closeModal();
    navigate("knowledge");
  }
}

async function deleteKnowledge(id) {
  if (!confirm("Eintrag löschen?")) return;
  await api("/knowledge/" + id, "DELETE");
  navigate("knowledge");
}

function closeModal() {
  var overlay = document.getElementById("modal-overlay");
  overlay.classList.add("hidden");
  overlay.classList.remove("flex");
}

// Initial Boot
if (TOKEN) {
  showApp();
  navigate("dashboard");
} else {
  showTab("login");
}
</script>
