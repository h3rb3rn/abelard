services:
  valkey:
    image: valkey/valkey:latest
    command: sh -c 'if [ -n "${VALKEY_PASSWORD}" ]; then valkey-server --requirepass "${VALKEY_PASSWORD}"; else valkey-server; fi'
    ports:
      - "0.0.0.0:8101:6379"
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - debate-net
    restart: unless-stopped

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?NEO4J_PASSWORD muss in der .env gesetzt sein}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_db_tx__log_rotation_retention__policy: "false"
      NEO4J_server_config__overrides_vetoed: ""
    ports:
      - "0.0.0.0:8102:7474"
      - "0.0.0.0:8103:7687"
    volumes:
      - neo4j-data:/data
      - neo4j-import:/import
    healthcheck:
      test: ["CMD-SHELL", "exec wget --spider -q http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 60
      start_period: 60s
    networks:
      - debate-net
    restart: unless-stopped

  chroma:
    image: chromadb/chroma:0.6.3
    ports:
      - "0.0.0.0:8104:8000"
    environment:
      ANONYMIZED_TELEMETRY: "False"
      CHROMA_SERVER_NO_TELEMETRY: "1"
    volumes:
      - chroma-data:/chroma/chroma
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - debate-net
    restart: unless-stopped

  searxng:
    image: searxng/searxng:latest
    ports:
      - "0.0.0.0:8105:8080"
    volumes: []
    environment:
      SEARXNG_SETTINGS_PATH: /etc/searxng/settings.yml
    healthcheck:
      test: ["CMD-SHELL", "exec wget --spider -q http://localhost:8080/ || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 60s
    networks:
      - debate-net
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    ports:
      - "0.0.0.0:8200:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-debate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD muss in der .env gesetzt sein}
      POSTGRES_DB: ${POSTGRES_DB:-sovereign_debate}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U debate"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - debate-net
    restart: unless-stopped

  app:
    build: .
    ports:
      - "0.0.0.0:8106:8000"
    env_file: .env
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?NEO4J_PASSWORD muss in der .env gesetzt sein}
      VALKEY_HOST: valkey
      VALKEY_PORT: 6379
      CHROMA_PERSIST_DIR: /chroma-data
      SEARXNG_BASE_URL: ${SEARXNG_BASE_URL:-http://searxng:8080}
      POSTGRES_URI: postgresql+asyncpg://${POSTGRES_USER:-debate}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sovereign_debate}
      ANONYMIZED_TELEMETRY: "False"
      CHROMA_SERVER_NO_TELEMETRY: "1"
    # Deployment-spezifische Ergaenzungen (z.B. extra_hosts fuer eine externe
    # SearXNG-Instanz) gehoeren in docker-compose.override.yml — die wird
    # automatisch gemerged und ist von der Veroeffentlichung ausgenommen.
    volumes:
      - .:/app
      - chroma-data:/chroma-data
      - debate-logs:/data/debate-logs
      - debate-uploads:/data/uploads
    depends_on:
      valkey:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      chroma:
        condition: service_healthy
      searxng:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - debate-net
    restart: unless-stopped

volumes:
  valkey-data:
  neo4j-data:
  neo4j-import:
  chroma-data:
  pg-data:
  debate-logs:
  debate-uploads:

networks:
  debate-net:
    driver: bridge
