[tool.poetry]
name = "abelard"
version = "0.1.0"
description = "Multi-Agenten-Debattenplattform mit GraphRAG-Gedaechtnis, KI-Moderation und Abschlussauswertung"
authors = ["Philipp Horn <kontakt@philipp-horn.dev>"]
readme = "README.md"
license = "MIT"

[tool.poetry.dependencies]
python = "^3.12"

# Web-Framework & ASGI
fastapi = "0.115.6"
uvicorn = { extras = ["standard"], version = "0.34.0" }
jinja2 = "3.1.5"
python-multipart = "0.0.30"

# Datenbank
sqlalchemy = { extras = ["asyncio"], version = "2.0.36" }
asyncpg = "0.30.0"

# Gedaechtnis
neo4j = "5.27.0"
chromadb = "0.6.3"
redis = { extras = ["hiredis"], version = "5.2.1" }

# HTTP — alle LLM-Aufrufe laufen ueber httpx gegen OpenAI-kompatible APIs.
httpx = "0.28.1"

# Konfiguration
pydantic = "2.10.4"
pydantic-settings = "2.7.1"
python-dotenv = "1.0.1"

# Dokumenten-Upload
pypdf = "6.14.2"
python-docx = "1.2.0"
pillow = "12.3.0"

typing-extensions = "4.12.2"

[tool.poetry.group.dev.dependencies]
pytest = "8.3.4"
pytest-asyncio = "0.25.2"
pytest-cov = "6.0.0"
ruff = "0.9.2"
mypy = "1.14.1"
bandit = "1.8.0"
mkdocs = "1.6.1"
mkdocs-material = "9.5.49"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# tests/critical-fixes laeuft in einer eigenen Container-Umgebung.
addopts = "--ignore=tests/critical-fixes"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S"]
ignore = ["S101"]  # assert in Tests ist gewollt

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E501"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
