site_name: Abelard
site_description: Multi-agent debate platform with GraphRAG memory, AI moderation, and reasoned evaluations
site_author: Philipp Horn
copyright: MIT License

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode
  features:
    - content.code.copy
    - content.code.annotate
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.instant
    - navigation.tracking
    - toc.follow
    - search.highlight
    - search.suggest

nav:
  - English:
    - Home: en/index.md
    - Architecture:
      - Overview: en/architecture/overview.md
      - Debate Lifecycle: en/architecture/debate-lifecycle.md
      - Data Models: en/architecture/data-models.md
      - Decision Log: en/architecture/decision-log.md
    - Features:
      - Personas & Evaluation: en/personas-and-evaluation.md
      - Automatic Agent Selection: en/automatic-agent-selection.md
      - Global Agents: en/global-agents.md
      - Import & Export: en/agent-import-export.md
      - Project Materials: en/uploads.md
    - Operations:
      - Configuration: en/configuration.md
      - Dependencies: en/dependencies.md
      - Deployment: en/deployment.md
      - Security: en/security.md
      - Publishing: en/publishing.md
    - API Reference: en/api-reference.md
    - Contributing: en/contributing.md
  - Deutsch:
    - Start: de/index.md
    - Architektur:
      - Überblick: de/architecture/overview.md
      - Debatten-Lebenszyklus: de/architecture/debate-lifecycle.md
      - Datenmodell: de/architecture/data-models.md
      - Entscheidungsprotokoll: de/architecture/decision-log.md
    - Funktionen:
      - Personas & Auswertung: de/personas-und-auswertung.md
      - Automatische Agentenauswahl: de/automatische-agentenauswahl.md
      - Globale Agenten: de/globale-agenten.md
      - Import & Export: de/agenten-import-export.md
      - Projekt-Material: de/uploads.md
    - Betrieb:
      - Konfiguration: de/konfiguration.md
      - Abhängigkeiten: de/abhaengigkeiten.md
      - Deployment: de/deployment.md
      - Sicherheit: de/security.md
      - Veröffentlichung: de/veroeffentlichung.md
    - API-Referenz: de/api-reference.md
    - Mitwirken: de/contributing.md

plugins:
  - search:
      lang: [en, de]

markdown_extensions:
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - admonition
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.snippets:
      base_path: ["."]
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: true
      toc_depth: 3
